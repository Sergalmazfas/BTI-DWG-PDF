steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/dwg-processor-metadata:latest', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/dwg-processor-metadata:latest']
  
  # Deploy container image to Cloud Run (existing service)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dwg-processor-metadata'
      - '--image'
      - 'gcr.io/$PROJECT_ID/dwg-processor-metadata:latest'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--timeout'
      - '900'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--concurrency'
      - '160'
      - '--service-account'
      - '637190449180-compute@developer.gserviceaccount.com'
      - '--set-env-vars'
      - 'GCS_BUCKET=btibot-processed,GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-secrets'
      - 'BOT_TOKEN=BOT_TOKEN:latest,FORGE_CLIENT_ID=FORGE_CLIENT_ID:latest,FORGE_CLIENT_SECRET=FORGE_CLIENT_SECRET:latest'

images:
  - 'gcr.io/$PROJECT_ID/dwg-processor-metadata:latest'
